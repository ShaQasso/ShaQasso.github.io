<div id="app">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <div class="brand">MBIOTA <span>the blob, in turns</span></div>
        <div class="turn"><b id="turn">TURN 1 / 30</b><span id="phase">plan</span></div>
        <div class="bars">

          <div id="plan-info"></div>
          <div class="btns">
