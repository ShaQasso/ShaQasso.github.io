<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MBIOTA — the blob</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='5' width='10' height='10' rx='3' fill='%23fbbf24'/><rect x='17' y='5' width='10' height='10' rx='3' fill='%2322d3ee'/><rect x='11' y='17' width='10' height='10' rx='3' fill='%23a78bfa'/></svg>" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <div class="brand">MBIOTA <span>the blob</span></div>
        <div class="act" id="act"></div>
        <div class="bars">
          <label>Host health<div class="bar"><i id="b-health"></i></div></label>
          <label>Inflammation<div class="bar infl"><i id="b-infl"></i></div></label>
          <label><span id="pop-label">Blob</span><div class="bar pop"><i id="b-pop"></i><u id="b-cap"></u></div></label>
        </div>
      </div>
      <div id="banner"></div>
      <div class="bottom">
        <div class="legend">
          <span><i style="background:#fbbf24"></i><b>Amber</b> mucus capsule</span>
          <span><i style="background:#22d3ee"></i><b>Cyan</b> phage-resistant</span>
          <span><i style="background:#a78bfa"></i><b>Violet</b> immune evasion</span>
        </div>
        <div class="secrete">
          <button id="secrete" type="button"><span id="sec-label">SECRETE</span> <u>space</u><s id="sec-cd"></s></button>
          <div id="sec-info"></div>
        </div>
        <div class="focus"><button id="slow" type="button">SLOW-MO <u>shift</u></button><div class="bar"><i id="b-focus"></i></div></div>
      </div>
    </div>
    <div id="screen"></div>
    <div id="tip"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
