            if (active.length === 0) return 0;
            let H = 0;
            active.forEach(m => {
                const p = m.abundance / 100;

            });

                };
            };

            const [microbes, setMicrobes] = useState(() => {
                const starters = getRandomCommensals(3);
                return [
                    createMicrobe(starters[0], `start_1`, 40, getRandomModifier('commensal', true)),
                    createMicrobe(starters[1], `start_2`, 40, getRandomModifier('commensal', true)),
                    createMicrobe(starters[2], `start_3`, 20, getRandomModifier('commensal', true)),
                ];
            });

            // Load Check
            useEffect(() => {
                const saved = localStorage.getItem(SAVE_KEY);
                if (saved) setHasSave(true);
            }, []);

            // Save Function
            const saveGame = () => {
                const stateToSave = {
                    level, baseHP, playerHP, inventory, logs, microbes, battlesSinceRest, frozenSample, view, runStats,
                    miniBossesDefeated, finalBossPhase, isFinalBossActive,
                    score, comboCount, comboMultiplier, maxCombo, abxUsedCount,
                    uniqueSynergiesActivated: [...uniqueSynergiesActivated],
                    usedPathogenAttack,
                    uniqueSpeciesUsed: [...uniqueSpeciesUsed],
                    totalTurns
                };
                localStorage.setItem(SAVE_KEY, JSON.stringify(stateToSave));
            };

            useEffect(() => {
                if (view !== 'START' && view !== 'GAMEOVER' && view !== 'VICTORY') {
                    saveGame();
                }
            }, [level, playerHP, inventory, microbes, view, runStats, miniBossesDefeated, score]);

            const loadGame = () => {
                const savedStr = localStorage.getItem(SAVE_KEY);
                if (savedStr) {
                    const saved = JSON.parse(savedStr);
                    setLevel(saved.level);
                    setBaseHP(saved.baseHP);
                    setPlayerHP(saved.playerHP);
                    setInventory({ abx: 1, food: 2, fmt: 0, phage: 1, prebiotic: 0, capsule: 0, ...(saved.inventory || {}) });
                    setLogs(saved.logs);
                    setMicrobes(saved.microbes);
                    setBattlesSinceRest(saved.battlesSinceRest);
                    setFrozenSample(saved.frozenSample);
                    setRunStats(saved.runStats || { itemsUsed: 0, battlesWon: 0, turnCount: 0, deathReason: '' });
                    setMiniBossesDefeated(saved.miniBossesDefeated || 0);
                    setFinalBossPhase(saved.finalBossPhase || 0);
                    setIsFinalBossActive(saved.isFinalBossActive || false);
                    setScore(saved.score || 0);
                    setComboCount(saved.comboCount || 0);
                    setComboMultiplier(saved.comboMultiplier || 1);
                    setMaxCombo(saved.maxCombo || 0);
                    setAbxUsedCount(saved.abxUsedCount || 0);
                    setUniqueSynergiesActivated(new Set(saved.uniqueSynergiesActivated || []));
                    setUsedPathogenAttack(saved.usedPathogenAttack || false);
                    setUniqueSpeciesUsed(new Set(saved.uniqueSpeciesUsed || []));
                    setTotalTurns(saved.totalTurns || 0);
                    setView(saved.view === 'BATTLE' ? 'MAP' : saved.view);
                    addLog("💾 Game loaded successfully.");
                }
            };

            // Sepsis Check
            useEffect(() => {
                const pathogenLoad = microbes.filter(m => m.type === 'pathogen').reduce((acc, m) => acc + m.abundance, 0);
                if (pathogenLoad >= 80 && view !== 'GAMEOVER' && view !== 'START' && view !== 'VICTORY') {
                    setRunStats(prev => ({...prev, deathReason: "Septic Shock: Pathogen Overrun"}));
                    setLogs(prev => ["☠️ CRITICAL SEPSIS. SYSTEM FAILURE.", ...prev]);
                    setView('GAMEOVER');
                    localStorage.removeItem(SAVE_KEY);
                }
            }, [microbes, view]);

            const maxHP = useMemo(() => calculateMaxHP(microbes, baseHP, level), [microbes, baseHP, level]);

            useEffect(() => {
                if (playerHP > maxHP) setPlayerHP(maxHP);
            }, [maxHP, playerHP]);

            const currentEntropy = useMemo(() => calculateShannonEntropy(microbes), [microbes]);

            const dynamicThreshold = useMemo(() => {
                if (microbes.length === 0) return 0;
                return Math.max(5, Math.floor((100 / Math.max(microbes.length, 4)) * 0.6));
            }, [microbes.length]);

            const activeSynergies = useMemo(() => {
                return SYNERGIES.filter(syn => {
                    const playerKeys = microbes.map(m => m.key);
                    return syn.microbes.every(req => playerKeys.includes(req));
                });
            }, [microbes]);

            // Track unique synergies activated
            useEffect(() => {
                activeSynergies.forEach(s => {
                    setUniqueSynergiesActivated(prev => new Set([...prev, s.id]));
                });
            }, [activeSynergies]);

            // Save high scores when VICTORY
            useEffect(() => {
                if (view === 'VICTORY') {
                    const diversityBonus = Math.floor(currentEntropy * 1000);
                    const speciesBonus = uniqueSpeciesUsed.size * 500;
                    const synergyBonus = uniqueSynergiesActivated.size * 1000;
                    const pathogenBonus = usedPathogenAttack ? 800 : 0;
                    const minimalistBonus = abxUsedCount === 0 ? 2000 : 0;
                    const comboBonus = maxCombo * 100;
                    const speedBonus = Math.max(0, 5000 - totalTurns * 10);
                    const totalBonus = diversityBonus + speciesBonus + synergyBonus + pathogenBonus + minimalistBonus + comboBonus + speedBonus;
                    const finalScore = score + totalBonus;
                    const grade = finalScore >= 50000 ? 'S' : finalScore >= 30000 ? 'A' : finalScore >= 15000 ? 'B' : 'C';

                    const scores = JSON.parse(localStorage.getItem(HISCORE_KEY_CONST) || '[]');
                    scores.push({ score: finalScore, grade, date: new Date().toLocaleDateString(), level });
                    scores.sort((a,b) => b.score - a.score);
                    localStorage.setItem(HISCORE_KEY_CONST, JSON.stringify(scores.slice(0, 5)));
                    localStorage.removeItem(SAVE_KEY);
                }
            }, [view]);

            const addLog = (msg) => {
                setLogs(prev => {
                    const newLogs = [msg, ...prev];
                    return newLogs.slice(0, 50);
                });
                if (!isLogOpen) setUnreadLogs(prev => prev + 1);
            };

            useEffect(() => {
                if (isLogOpen) setUnreadLogs(0);
            }, [isLogOpen]);

            // --- TARGETING LOGIC ---
            const toggleTargeting = (mode) => {
                if (targetingMode === mode) {
                    setTargetingMode(null);
                    addLog("Cancelled selection.");
                } else {
                    setTargetingMode(mode);
                    addLog(mode === 'food' ? "Select a microbe to FEED." : "Select a microbe to INFECT with Phages.");
                }
            };

            const handleTargetSelect = (targetMicrobe) => {
                if (targetingMode === 'food') {
                    if (inventory.food <= 0) return;
                    setInventory(prev => ({...prev, food: prev.food - 1}));
                    setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                    setMicrobes(prev => {
                        let newM = prev.map(m => {
                            if (m.id === targetMicrobe.id) return { ...m, abundance: m.abundance + 15 };
                            return m;
                        });
                        return normalizeAbundance(newM);
                    });
                    addLog(`Fed ${targetMicrobe.name}. Abundance increased.`);
                } else if (targetingMode === 'phage') {
                    if (inventory.phage <= 0) return;
                    setInventory(prev => ({...prev, phage: prev.phage - 1}));
                    setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                    setMicrobes(prev => {
                        let killed = false;
                        let newM = prev.map(m => {
                            if (m.id === targetMicrobe.id) {
                                let newAbundance = m.abundance * 0.5;
                                if (newAbundance < 4) { killed = true; return null; }
                                return { ...m, abundance: newAbundance };
                            }
                            return m;
                        }).filter(m => m !== null);
                        if (killed) addLog(`🎯 Phage liquidated ${targetMicrobe.name}! Strain eliminated.`);
                        else addLog(`Phage injected into ${targetMicrobe.name}. Abundance halved.`);
                        return normalizeAbundance(newM);
                    });
                }
                setTargetingMode(null);
            };

            // --- FMT MECHANICS ---
            const getScaledLevel = () => {
                const min = Math.max(1, level - 3);
                const max = level + 3;
                return Math.floor(Math.random() * (max - min + 1)) + min;
            };

            const freezeSample = () => {
                setFrozenSample(JSON.parse(JSON.stringify(microbes)));
                addLog("💩 Sample Frozen for later use.");
            };

            const thawSample = () => {
                if (!frozenSample || inventory.fmt <= 0) return;
                setInventory(prev => ({...prev, fmt: prev.fmt - 1}));
                setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                const scaledSample = frozenSample.map(m => ({ ...m, level: getScaledLevel(), xp: 0 }));
                setMicrobes(scaledSample);
                addLog("💩 Microbiome restored & adapted (Used 1 FMT Kit).");
            };

            const randomTransplant = () => {
                if (inventory.fmt <= 0) return;
                const count = 3 + Math.floor(Math.random() * 3);
                const currentKeys = microbes.map(m => m.key);
                const availableKeys = Object.keys(SPECIES_DB).filter(k => SPECIES_DB[k].type === 'commensal' && !currentKeys.includes(k));
                if (availableKeys.length === 0) { addLog("💩 Transplant failed: Biodiversity maxed out!"); return; }
                const shuffledAvailable = availableKeys.sort(() => 0.5 - Math.random()).slice(0, count);
                const newBiom = shuffledAvailable.map((k, i) => createMicrobe({ ...SPECIES_DB[k], key: k }, `donor_${i}_${Date.now()}`, 20, null));
                setInventory(prev => ({...prev, fmt: prev.fmt - 1}));
                setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                setMicrobes(normalizeAbundance(newBiom));
                addLog("💩 Anonymous Donor Transplant received (Used 1 FMT Kit).");
            };

            const triggerInfection = () => {
                let logMsg = "";
                setMicrobes(prev => {
                    const existingPathogen = prev.find(m => m.type === 'pathogen');
                    if (existingPathogen) {
                        const newM = prev.map(m => {
                            if (m.id === existingPathogen.id) return { ...m, abundance: m.abundance + 10 };
                            return m;
                        });
                        logMsg = `⚠️ FLARE UP: ${existingPathogen.name} counts increased!`;
                        return normalizeAbundance(newM);
                    } else {
                        const types = ['cdiff', 'salmo', 'candida', 'pylori'];
                        const type = types[Math.floor(Math.random() * types.length)];
                        const newInfection = createMicrobe({ ...SPECIES_DB[type], key: type }, `inf_${Date.now()}`, 10);
                        newInfection.level = level;
                        const newM = [...prev, newInfection];
                        logMsg = `⚠️ WARNING: ${newInfection.name} infection detected!`;
                        return normalizeAbundance(newM);
                    }
                });
                if (logMsg) addLog(logMsg);
            };

            // --- NEW v2.0 ITEMS ---
            const usePrebiotic = () => {
                if (inventory.prebiotic <= 0) return;
                setInventory(prev => ({...prev, prebiotic: prev.prebiotic - 1}));
                setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                setMicrobes(prev => {
                    const newM = prev.map(m => {
                        if (m.type === 'commensal' && m.rps === 'green') return { ...m, abundance: m.abundance + 8 };
                        return m;
                    });
                    return normalizeAbundance(newM);
                });
                addLog("🌾 Prebiotic Fiber fed! All green microbes +8% abundance.");
            };

            const useProbioticCapsule = () => {
                if (inventory.capsule <= 0) return;
                setInventory(prev => ({...prev, capsule: prev.capsule - 1}));
                setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                const currentKeys = microbes.map(m => m.key);
                const availableKeys = Object.keys(SPECIES_DB).filter(k => SPECIES_DB[k].type === 'commensal' && !currentKeys.includes(k));
                if (availableKeys.length === 0) { addLog("💊 Capsule failed: All strains already present!"); return; }
                const key = availableKeys[Math.floor(Math.random() * availableKeys.length)];
                const newMicrobe = createMicrobe({ ...SPECIES_DB[key], key }, `cap_${Date.now()}`, 10);
                newMicrobe.level = Math.max(1, level - 1);
                setMicrobes(prev => normalizeAbundance([...prev, newMicrobe]));
                addLog(`💊 Probiotic Capsule used! ${SPECIES_DB[key].name} introduced.`);
            };

            const useABX = () => {
                if (inventory.abx <= 0) return;
                setInventory(prev => ({...prev, abx: prev.abx - 1}));
                setRunStats(prev => ({...prev, itemsUsed: prev.itemsUsed + 1}));
                setAbxUsedCount(prev => prev + 1);
                setMicrobes(prev => {
                    let newM = prev.map(m => {
                        if (m.type === 'pathogen') return { ...m, abundance: m.abundance * 0.1 };
                        return { ...m, abundance: m.abundance * 0.80 };
                    }).filter(m => m.abundance > 5);
                    addLog("Antibiotics deployed. Widespread reduction. Weak strains wiped out.");
                    return normalizeAbundance(newM);
                });
            };

            const startGame = () => {
                setRunStats({ itemsUsed: 0, battlesWon: 0, turnCount: 0, deathReason: '' });
                const starters = getRandomCommensals(3);
                setMicrobes([
                    createMicrobe(starters[0], `start_1_${Date.now()}`, 40, getRandomModifier('commensal', true)),
                    createMicrobe(starters[1], `start_2_${Date.now()}`, 40, getRandomModifier('commensal', true)),
                    createMicrobe(starters[2], `start_3_${Date.now()}`, 20, getRandomModifier('commensal', true)),
                ]);
                setBaseHP(INITIAL_BASE_HP);
                setPlayerHP(INITIAL_BASE_HP + (3 * HP_PER_SPECIES + 10));
                setLevel(1);
                setShield(0);
                setEnemyShield(0);
                setBattlesSinceRest(3);
                setInventory({ abx: 1, food: 2, fmt: 0, phage: 1, prebiotic: 0, capsule: 0 });
                setLogs(['Run initialized. Maintain diversity to survive.']);
                setMiniBossesDefeated(0);
                setFinalBossPhase(0);
                setIsFinalBossActive(false);
                setShowBossFanfare(false);
                setScore(0);
                setComboCount(0);
                setComboMultiplier(1);
                setMaxCombo(0);
                setAbxUsedCount(0);
                setUniqueSynergiesActivated(new Set());
                setUsedPathogenAttack(false);
                setUniqueSpeciesUsed(new Set());
                setTotalTurns(0);
                setBiofilmBroken(false);
                setSilencedMicrobes(new Set());
                setSkippedMicrobes(new Set());
                setStressActive(false);
                setEnemyDebuff(0);
                setView('MAP');
                localStorage.removeItem(SAVE_KEY);
            };

            const generateSheddingMixes = () => {
                const mixes = [];
                const mixNames = ["Recovery Blend", "Diversity Mix", "Gut Reinforce", "Colonization Kit", "Flora Restore"];
                for(let i=0; i<3; i++) {
                    const selected = getRandomCommensals(3);
                    const name = mixNames[Math.floor(Math.random() * mixNames.length)];
                    mixes.push({ id: i, name: `${name} ${i+1}`, bugs: selected });
                }
                setDraftMixes(mixes);
            };

            const startFinalBoss = () => {
                setIsFinalBossActive(true);
                setFinalBossPhase(1);
                const phase = FINAL_BOSS_PHASES[0];
                setEnemy({ ...phase, currentHp: phase.hp, maxHp: phase.hp, modifier: null });
                setShowBossFanfare('final');
                setTimeout(() => setShowBossFanfare(false), 1500);
                setTimeout(() => setView('BATTLE'), 1500);
                setShield(0);
                setEnemyShield(0);
                setTurn(0);
                setBiofilmBroken(false);
                addLog("💀 THE DYSBIOSIS OVERLORD AWAKENS!");
            };

            const startEncounter = (type) => {
                if (type === 'miniboss') {
                    const bossIndex = miniBossesDefeated % MINI_BOSSES.length;
                    const boss = MINI_BOSSES[bossIndex];
                    const scaledBoss = { 
                        ...boss, 
                        hp: boss.hp + level * 5, 
                        dmg: boss.dmg + Math.floor(level * 0.5), 
                        currentHp: boss.hp + level * 5, 
                        maxHp: boss.hp + level * 5, 
                        modifier: getRandomModifier('enemy') 
                    };
                    setEnemy(scaledBoss);
                    setShowBossFanfare('mini');
                    setTimeout(() => setShowBossFanfare(false), 1500);
                    setTimeout(() => setView('BATTLE'), 1500);
                    setShield(0);
                    setEnemyShield(0);
                    setTurn(0);
                    setBiofilmBroken(false);
                    addLog(`⚠️ MINI-BOSS: ${scaledBoss.name} appears!`);
                    return;
                }

                const isHazard = type === 'hazard';
                const bossLevel = level % 5 === 0;
                let potentialEnemies = [];

                if (bossLevel) {
                    potentialEnemies = ENEMIES.filter(e => e.type === 'boss' && level >= e.minLvl);
                } else if (isHazard) {
                    potentialEnemies = ENEMIES.filter(e => e.type === 'elite' && level >= e.minLvl);
                    if (potentialEnemies.length === 0) potentialEnemies = ENEMIES.filter(e => e.type === 'basic');
                } else {
                    potentialEnemies = ENEMIES.filter(e => e.type === 'basic' && level >= e.minLvl);
                }
                if (potentialEnemies.length === 0) potentialEnemies = [ENEMIES[0]];
                const template = potentialEnemies[Math.floor(Math.random() * potentialEnemies.length)];

                const modifier = getRandomModifier('enemy');
                let scale = bossLevel ? 1 + (level * 0.30) : 1 + (level * 0.40);
                if (isHazard && !bossLevel && template.type === 'basic') scale *= 1.3;

                let finalDmg = Math.floor(template.dmg * scale);
                if (modifier === 'aggressive') finalDmg = Math.floor(finalDmg * 1.25);

                setEnemy({
                    ...template,
                    currentHp: Math.floor(template.hp * scale),
                    maxHp: Math.floor(template.hp * scale),
                    dmg: finalDmg,
                    dropChance: isHazard ? Math.min(1.0, template.dropChance * 1.5) : template.dropChance,
                    modifier: modifier
                });

                const modLog = modifier ? ` (${MODIFIERS.enemy[modifier].name})` : '';
                setShield(0);
                setEnemyShield(0);
                setBiofilmBroken(false);
                setView('BATTLE');
                setTurn(0);
                addLog(`${isHazard ? '⚠️ HAZARD!' : '⚔️'} Approaching: ${template.name}${modLog} (Lv.${level}).`);

                // Hazard: 40% chance to drop prebiotic
                if (isHazard && Math.random() < 0.4) {
                    setInventory(prev => ({...prev, prebiotic: prev.prebiotic + 1}));
                    addLog("🌾 Found Prebiotic Fiber in the hazard zone!");
                }
            };

            const performRest = () => {
                const healAmount = 15 + (level * 5);
                setPlayerHP(Math.min(maxHP, playerHP + healAmount));
                addLog(`Rested. Recovered ${healAmount} HP.`);
                setLevel(l => l+1);
                setBattlesSinceRest(0);
            };

            const handlePlayerAction = (microbe, skillType) => {
                if (microbe.abundance < dynamicThreshold) {
                    addLog("❌ Microbe dormant. Abundance too low!");
                    return;
                }

                const skill = microbe.skills[skillType];
                let dmg = 0;
                let heal = 0;
                let block = 0;
                const lvlBonus = (microbe.level - 1) * 4;
                const mod = microbe.modifier;

                if (skill.dmg) {
                    dmg = skill.dmg + lvlBonus;
                    if (mod === 'hasty') dmg = Math.floor(dmg * 1.5);
                    if (mod === 'bulky') dmg = Math.floor(dmg * 0.6);
                    if (mod === 'toxic') dmg = Math.floor(dmg * 1.8);
                }
                if (skill.heal) {
                    heal = skill.heal + lvlBonus;
                    if (mod === 'pure') heal = Math.floor(heal * 1.25);
                }
                if (skill.block) {
                    block = skill.block + lvlBonus;
                    if (mod === 'bulky') block = Math.floor(block * 1.4);
                    if (mod === 'pure') block = Math.floor(block * 1.25);
                }

                // Synergy bonuses
                if (activeSynergies.some(s => s.id === 'acid')) dmg += (3 + microbe.level);
                if (activeSynergies.some(s => s.id === 'spore')) dmg = Math.floor(dmg * 1.1);
                if (activeSynergies.some(s => s.id === 'flora') && block > 0) block += (5 + (microbe.level * 2));

                // v2.0 Synergy: Butyrate Brigade - DEF +5 heal
                if (activeSynergies.some(s => s.id === 'butyrate') && skillType === 'def') {
                    heal += 5;
                }

                // v2.0 Synergy: Sulfur Storm - ATK +15%, host -2 HP
                if (activeSynergies.some(s => s.id === 'sulfur') && skillType === 'atk' && dmg > 0) {
                    dmg = Math.floor(dmg * 1.15);
                    setPlayerHP(prev => Math.max(1, prev - 2));
                    addLog(`☣️ Sulfur Storm: +15% ATK, host takes 2 dmg.`);
                }

                // v2.0 Synergy: Fiber Fermenters - ATK debuffs enemy
                if (activeSynergies.some(s => s.id === 'fiber') && skillType === 'atk') {
                    setEnemyDebuff(0.15);
                    addLog(`🌾 Fiber Fermenters: Enemy next attack -15%!`);
                }

                const rpsMult = getRPSBonus(microbe.rps, enemy?.rps);
                if (rpsMult > 1) dmg = Math.floor(dmg * rpsMult);

                // Enemy Resistance Modifier
                if (enemy?.modifier === 'resistant' && dmg > 0) {
                    dmg = Math.floor(dmg * 0.8);
                    addLog(`🛡️ Enemy is Resistant (-20% Dmg)`);
                }

                // v2.0 Biofilm modifier
                if (enemy?.modifier === 'biofilm' && !biofilmBroken && dmg > 0) {
                    dmg = Math.floor(dmg * 0.5);
                    setBiofilmBroken(true);
                    addLog(`🧫 Biofilm absorbs half the damage! (${dmg} dealt)`);
                }

                let isCrit = false;
                if (dmg > 0) {
                    const roll = Math.floor(Math.random() * 20) + 1;
                    if (roll === 20) {
                        dmg = dmg * 2;
                        isCrit = true;
                    }
                }

                // v2.0 Sporulating modifier
                if (enemy?.modifier === 'sporulating' && enemy?.currentHp && (enemy.currentHp - dmg) < (enemy.maxHp * 0.3) && !enemy.sporulatingTriggered && dmg > 0) {
                    setEnemyShield(prev => prev + 10);
                    setEnemy(prev => ({...prev, sporulatingTriggered: true}));
                    addLog(`🌿 ${enemy.name} sporulates! +10 Shield`);
                }

                if (block) heal += Math.floor(block * 0.5);

                // --- MODIFIER LOGIC: XP & SIDE EFFECTS ---
                let xpGain = XP_PER_ACTION;
                if (mod === 'efficient') xpGain = Math.floor(xpGain * 1.5);

                let newXp = microbe.xp + xpGain;
                let newLevel = microbe.level;
                let leveledUp = false;
                const threshold = getXpThreshold(microbe.level);

                if (newXp >= threshold) {
                    newXp -= threshold;
                    newLevel += 1;
                    leveledUp = true;
                }

                let abundanceChange = 0;
                if (microbe.type === 'pathogen') {
                    const growthAmt = stressActive ? 16 : 8;
                    abundanceChange += growthAmt;
                    addLog(`⚠️ ${microbe.name} grows from activity!`);
                }

                if (mod === 'hasty') {
                    abundanceChange -= 5;
                    addLog(`⚡ ${microbe.name} is Hasty! Burns 5% Abundance.`);
                }

                if (mod === 'toxic') {
                    setPlayerHP(prev => {
                        const newVal = prev - 4;
                        if (newVal <= 0) {
                            setRunStats(s => ({...s, deathReason: `Betrayed by Toxic ${microbe.name}`}));
                            setView('GAMEOVER');
                        }
                        return newVal;
                    });
                    addLog(`🤢 ${microbe.name} is Toxic! Host takes 4 Dmg.`);
                }

                // v2.0 skill: selfDmg
                if (skill.selfDmg) {
                    setPlayerHP(prev => Math.max(1, prev - skill.selfDmg));
                    addLog(`💥 ${microbe.name} self-damages host for ${skill.selfDmg}!`);
                }

                // Recoil (Spore Striker)
                if (skill.recoil && skillType === 'atk') {
                    setPlayerHP(prev => Math.max(1, prev - skill.recoil));
                    addLog(`💥 ${microbe.name} recoil! Host takes ${skill.recoil} dmg.`);
                }

                // v2.0 skill: selfAbundance
                if (skill.selfAbundance && skillType === 'def') {
                    abundanceChange += skill.selfAbundance;
                    addLog(`📈 ${microbe.name} colonizes faster! +${skill.selfAbundance}% abundance.`);
                }

                // v2.0 skill: skipNext (Endospore)
                if (skill.skipNext && skillType === 'def') {
                    setSkippedMicrobes(prev => new Set([...prev, microbe.id]));
                    addLog(`💤 ${microbe.name} enters Endospore state — stunned next turn.`);
                }

                setMicrobes(prev => {
                    let newM = prev.map(m => {
                        if (m.id === microbe.id) {
                            return { ...m, xp: newXp, level: newLevel, abundance: m.abundance + abundanceChange };
                        }
                        return m;
                    });
                    if (abundanceChange !== 0) return normalizeAbundance(newM);
                    return newM;
                });

                // v2.0 skill: hits: 2 (Spore Volley) — deal damage twice
                const hitCount = skill.hits || 1;
                let totalDmgDealt = 0;

                const dealDamageHit = (hitDmg, hitNum) => {
                    let actualDmg = hitDmg;
                    let hitIsCrit = false;
                    if (hitNum > 1 && hitDmg > 0) {
                        const roll2 = Math.floor(Math.random() * 20) + 1;
                        if (roll2 === 20) { actualDmg = hitDmg * 2; hitIsCrit = true; }
                    }
                    if (actualDmg > 0) {
                        let dmgAfterShield = actualDmg;
                        setEnemyShield(prevShield => {
                            if (prevShield >= dmgAfterShield) {
                                addLog(`🛡️ Enemy Blocked ${dmgAfterShield} DMG!`);
                                dmgAfterShield = 0;
                                return prevShield - actualDmg;
                            } else {
                                dmgAfterShield = actualDmg - prevShield;
                                if (prevShield > 0) addLog(`🛡️ Enemy Shield broken!`);
                                return 0;
                            }
                        });
                        // We need to apply damage after shield calc — use a ref approach
                        return actualDmg;
                    }
                    return 0;
                };

                if (dmg > 0) {
                    let remainingEnemyShield = enemyShield;
                    let totalActualDmg = 0;

                    for (let h = 0; h < hitCount; h++) {
                        let hitDmg = h === 0 ? dmg : dmg; // same dmg per hit for multi-hit
                        if (h > 0) {
                            // Second hit can also crit
                            const roll2 = Math.floor(Math.random() * 20) + 1;
                            if (roll2 === 20) { hitDmg = hitDmg * 2; addLog(`🎯 CRITICAL HIT (hit ${h+1})!`); }
                        }

                        let actualHitDmg = hitDmg;
                        if (remainingEnemyShield >= actualHitDmg) {
                            remainingEnemyShield -= actualHitDmg;
                            addLog(`🛡️ Enemy Blocked ${actualHitDmg} DMG! (hit ${h+1})`);
                            actualHitDmg = 0;
                        } else {
                            actualHitDmg -= remainingEnemyShield;
                            if (remainingEnemyShield > 0) addLog(`🛡️ Enemy Shield broken!`);
                            remainingEnemyShield = 0;
                        }
                        totalActualDmg += actualHitDmg;
                    }

                    setEnemyShield(remainingEnemyShield);

                    if (totalActualDmg > 0) {
                        setEnemy(prev => ({...prev, currentHp: prev.currentHp - totalActualDmg}));
                        const effMsg = rpsMult > 1 ? " (Super Effective!)" : "";
                        const critMsg = isCrit ? " 🎯 CRITICAL HIT!" : "";
                        const multiMsg = hitCount > 1 ? ` (${hitCount} hits)` : "";
                        addLog(`${microbe.name} hit for ${totalActualDmg} DMG${effMsg}${critMsg}${multiMsg}`);
                    }
                    totalDmgDealt = totalActualDmg;
                }

                if (heal > 0) {
                    setPlayerHP(prev => Math.min(maxHP, prev + heal));
                    addLog(`${microbe.name} restored ${heal} HP.`);
                }
                if (block > 0) {
                    setShield(prev => prev + block);
                    addLog(`${microbe.name} raised ${block} Shields.`);
                }
                if (leveledUp) addLog(`⭐ ${microbe.name} grew to Level ${newLevel}!`);

                // --- v2.0 COMBO SYSTEM ---
                let comboGained = 0;
                let comboReasons = [];

                const isSynergyMicrobe = activeSynergies.some(s => s.microbes.includes(microbe.key));
                if (isSynergyMicrobe && skillType === 'atk') { comboGained += 3; comboReasons.push('SYNERGY'); }
                if (rpsMult > 1 && skillType === 'atk') { comboGained += 2; comboReasons.push('SUPER EFFECTIVE'); }
                if (microbe.type === 'pathogen' && skillType === 'atk') { comboGained += 2; comboReasons.push('PATHOGEN POWER'); setUsedPathogenAttack(true); }
                if (isCrit) { comboGained += 2; comboReasons.push('CRITICAL'); }

                if (comboGained > 0) {
                    setComboCount(prev => {
                        const newCombo = prev + comboGained;
                        const newMult = newCombo >= 8 ? 3 : newCombo >= 4 ? 2 : 1;
                        setComboMultiplier(newMult);
                        setMaxCombo(prevMax => Math.max(prevMax, newCombo));
                        const scoreGain = comboGained * 50 * newMult;
                        setScore(prevScore => prevScore + scoreGain);
                        setComboFlash({ text: `+${comboGained} COMBO! ×${newMult}`, reasons: comboReasons, id: Date.now() });
                        setTimeout(() => setComboFlash(null), 1200);
                        addLog(`⚡ [COMBO] ${comboReasons.join(' + ')} — +${scoreGain} pts (×${newMult})`);
                        return newCombo;
                    });
                }

                setUniqueSpeciesUsed(prev => new Set([...prev, microbe.key || microbe.name]));
                setTotalTurns(prev => prev + 1);

                // Check victory condition
                const currentEnemyHp = enemy.currentHp - totalDmgDealt;
                if (currentEnemyHp <= 0 && totalDmgDealt > 0) {
                    handleVictory();
                } else {
                    setTurn(1);
                }
            };

            // Enemy Turn useEffect
            useEffect(() => {
                let timer;
                if (view === 'BATTLE' && turn === 1 && enemy) {
                    setBiofilmBroken(false); // Reset biofilm each enemy turn
                    timer = setTimeout(() => {
                        // v2.0: Mini-boss mechanics BEFORE normal attack
                        if (enemy.type === 'miniboss') {
                            switch(enemy.mechanic) {
                                case 'cull':
                                    setMicrobes(prev => {
                                        const commensals = prev.filter(m => m.type === 'commensal' && m.abundance > 5);
                                        if (commensals.length > 0) {
                                            const weakest = commensals.reduce((a, b) => a.abundance < b.abundance ? a : b);
                                            addLog(`📉 ${enemy.name} CULLS ${weakest.name}! Heavy losses!`);
                                            const newM = prev.map(m => m.id === weakest.id ? { ...m, abundance: m.abundance * 0.7 } : m);
                                            return normalizeAbundance(newM);
                                        }
                                        return prev;
                                    });
                                    break;
                                case 'stress':
                                    setStressActive(true);
                                    setTimeout(() => setStressActive(false), 2000);
                                    addLog(`😰 ${enemy.name} triggers Cortisol Cascade! Pathogen growth doubled!`);
                                    break;
                                case 'abx':
                                    setMicrobes(prev => normalizeAbundance(prev.map(m => m.type === 'commensal' ? {...m, abundance: m.abundance * 0.9} : m)));
                                    addLog(`☣️ ${enemy.name} releases antibiotics! All commensals -10%`);
                                    break;
                                case 'biofilm':
                                    setEnemyShield(prev => prev + 20);
                                    addLog(`🧫 ${enemy.name} regenerates Biofilm! +20 Shield`);
                                    break;
                                case 'overgrow':
                                    triggerInfection();
                                    addLog(`🦠 ${enemy.name} seeds a new pathogen!`);
                                    break;
                                case 'burn':
                                    setPlayerHP(prev => Math.max(1, prev - 5));
                                    addLog(`🔥 ${enemy.name} burns the host! -5 true damage`);
                                    break;
                                case 'silence':
                                    setMicrobes(prev => {
                                        const commensals = prev.filter(m => m.type === 'commensal' && m.abundance > 5);
                                        if (commensals.length > 0) {
                                            const highest = commensals.reduce((a, b) => a.abundance > b.abundance ? a : b);
                                            setSilencedMicrobes(prevS => new Set([...prevS, highest.id]));
                                            setTimeout(() => setSilencedMicrobes(prevS => { const n = new Set(prevS); n.delete(highest.id); return n; }), 3000);
                                            addLog(`🔇 ${enemy.name} silences ${highest.name}!`);
                                        }
                                        return prev;
                                    });
                                    break;
                                case 'drain':
                                    setMicrobes(prev => {
                                        const commensals = prev.filter(m => m.type === 'commensal' && m.abundance > 5);
                                        if (commensals.length > 0) {
                                            const target = commensals[Math.floor(Math.random() * commensals.length)];
                                            addLog(`🩸 ${enemy.name} drains ${target.name}! -8% abundance`);
                                            return normalizeAbundance(prev.map(m => m.id === target.id ? {...m, abundance: m.abundance * 0.92} : m));
                                        }
                                        return prev;
                                    });
                                    break;
                            }
                        }

                        const action = Math.random();

                        // ACTION 1: DEFEND (20%)
                        if (action < 0.2) {
                            const blockAmt = Math.floor(enemy.dmg * 1.5);
                            setEnemyShield(prev => prev + blockAmt);
                            addLog(`🛡️ ${enemy.name} raises defenses (+${blockAmt} Shield)`);
                        }
                        // ACTION 2: INFECT/PATHOGEN BOOST (20%)
                        else if (action < 0.4 && enemy.type !== 'boss' && enemy.type !== 'miniboss') {
                            triggerInfection();
                            addLog(`☣️ ${enemy.name} accelerates Pathogen growth!`);
                        }
                        // ACTION 3: MICROBIAL CULL (20%)
                        else if (action < 0.6) {
                            setMicrobes(prev => {
                                const commensals = prev.filter(m => m.type === 'commensal' && m.abundance > 5);
                                if (commensals.length > 0) {
                                    const target = commensals[Math.floor(Math.random() * commensals.length)];
                                    addLog(`📉 ${enemy.name} CULLS your colony! ${target.name} takes heavy losses!`);
                                    const newM = prev.map(m => {
                                        if (m.id === target.id) return { ...m, abundance: m.abundance * 0.7 };
                                        return m;
                                    });
                                    return normalizeAbundance(newM);
                                } else {
                                    addLog(`⚠️ ${enemy.name} tries to cull, but colony is too weak! Attacks host instead.`);
                                    setPlayerHP(prev => Math.max(0, prev - 15));
                                    return prev;
                                }
                            });
                        }
                        // ACTION 4: DIRECT DAMAGE (40%)
                        else {
                            let dmg = enemy.dmg;
                            // Apply enemy debuff from Fiber Fermenters
                            if (enemyDebuff > 0) {
                                dmg = Math.floor(dmg * (1 - enemyDebuff));
                                addLog(`🌾 Fiber Fermenters debuff! Enemy attack reduced by ${Math.floor(enemyDebuff * 100)}%`);
                                setEnemyDebuff(0);
                            }
                            // Aggressive modifier
                            if (enemy.modifier === 'aggressive') dmg = Math.floor(dmg * 1.25);

                            setShield(prevShield => {
                                let damageToHp = 0;
                                let newShield = prevShield;
                                if (prevShield >= dmg) {
                                    newShield -= dmg;
                                    addLog(`🛡️ Blocked ${dmg} damage!`);
                                } else {
                                    damageToHp = dmg - prevShield;
                                    newShield = 0;
                                    if (prevShield > 0) addLog(`🛡️ Shield broke! Taking ${damageToHp} damage.`);
                                    else addLog(`💥 ${enemy.name} deals ${damageToHp} damage!`);
                                }
                                if (damageToHp > 0) {
                                    // Reset combo on damage
                                    setComboCount(0);
                                    setComboMultiplier(1);
                                    setPlayerHP(prevHp => {
                                        const newVal = prevHp - damageToHp;
                                        if (newVal <= 0) {
                                            setRunStats(s => ({...s, deathReason: `Killed by ${enemy.name}`}));
                                            setView('GAMEOVER');
                                            localStorage.removeItem(SAVE_KEY);
                                        }
                                        return newVal;
                                    });
                                }
                                return newShield;
                            });
                        }

                        // Turn cleanup
                        setTimeout(() => {
                            setShield(0);
                            // Clear skipped microbes at end of enemy turn
                            setSkippedMicrobes(new Set());
                            let regen = Math.floor(currentEntropy * (level * 2));
                            if (activeSynergies.some(s => s.id === 'mucus')) {
                                regen += (2 + level);
                                addLog(`💚 Mucus Synergy: +${2+level} Regen`);
                            }
                            if (regen > 0) {
                                setPlayerHP(prev => Math.min(maxHP, prev + regen));
                                addLog(`💚 Bio-Diversity Regen: +${regen} HP`);
                            }
                            setTurn(0);
                        }, 1000);

                    }, 1000);
                }
                return () => clearTimeout(timer);
            }, [turn, view, enemy, microbes, maxHP, activeSynergies, level, currentEntropy, enemyDebuff]);

            const handleVictory = () => {
                setRunStats(prev => ({ ...prev, battlesWon: prev.battlesWon + 1 }));

                // Volatile Check
                let diedFromExplosion = false;
                if (enemy.modifier === 'volatile') {
                    const boom = 15 + (level * 2);
                    setPlayerHP(prev => {
                        const newVal = prev - boom;
                        if (newVal <= 0) {
                            setRunStats(s => ({...s, deathReason: `Killed by Volatile Explosion (${enemy.name})`}));
                            setView('GAMEOVER');
                            diedFromExplosion = true;
                        }
                        return Math.max(0, newVal);
                    });
                    addLog(`💥 ${enemy.name} EXPLODES! You take ${boom} damage.`);
                    if (playerHP - (15 + level * 2) <= 0) return; // guard with current known HP
                }

                // v2.0 Score for defeating enemy
                const enemyScoreValue = enemy.type === 'boss' ? 500 : enemy.type === 'miniboss' ? 300 : enemy.type === 'elite' ? 150 : 80;
                setScore(prev => prev + enemyScoreValue);
                addLog(`🏆 +${enemyScoreValue} pts for defeating ${enemy.name}`);

                addLog(`Victory! ${enemy.name} defeated.`);

                // v2.0 Final Boss Phase Transitions
                if (isFinalBossActive) {
                    if (finalBossPhase < 3) {
                        const nextPhaseData = FINAL_BOSS_PHASES[finalBossPhase]; // finalBossPhase is 1-indexed, array is 0-indexed
                        setFinalBossPhase(prev => prev + 1);
                        setEnemy({ ...nextPhaseData, currentHp: nextPhaseData.hp, maxHp: nextPhaseData.hp, modifier: null });
                        setEnemyShield(0);
                        addLog(`⚠️ PHASE TRANSITION! The Overlord mutates into Phase ${finalBossPhase + 1}!`);
                        setTurn(0);
                        return; // Stay in BATTLE
                    } else {
                        // Phase 3 defeated — true victory!
                        setView('VICTORY');
                        localStorage.removeItem(SAVE_KEY);
                        return;
                    }
                }

                // v2.0 Mini-boss rewards
                if (enemy.type === 'miniboss') {
                    setMiniBossesDefeated(prev => prev + 1);
                    setInventory(prev => ({...prev, capsule: prev.capsule + 1}));
                    addLog("💊 Mini-Boss defeated! Gained 1 Probiotic Capsule.");
                }

                if (level % 5 === 0 && enemy.type === 'boss') {
                    setBaseHP(prev => prev + 20);
                    setInventory(prev => ({ ...prev, fmt: prev.fmt + 1 }));
                    addLog("🏆 BOSS DEFEATED! Gained +20 Max HP and 1 FMT Kit.");
                }

                // Common Drop
                if (Math.random() < 0.5) {
                    const item = Math.random() < 0.6 ? 'food' : 'phage';
                    setInventory(prev => ({ ...prev, [item]: prev[item] + 1 }));
                    addLog(`Loot Found: 1 ${item.toUpperCase()}`);
                } else {
                    addLog("No common resources found.");
                }

                // Rare Drop
                if (Math.random() < enemy.dropChance) {
                    const rand = Math.random();
                    let drop = 'food';
                    if (rand > 0.85) drop = 'fmt';
                    else if (rand > 0.65) drop = 'abx';
                    else if (rand > 0.35) drop = 'phage';
                    setInventory(prev => ({ ...prev, [drop]: prev[drop] + 1 }));
                    addLog(`✨ Lucky Find: 1 ${drop.toUpperCase()}`);
                }

                // Leftovers XP
                const leftoverXP = 50 + (level * 10);
                setMicrobes(prev => prev.map(m => {
                    let newXp = m.xp + leftoverXP;
                    let newLvl = m.level;
                    while (newXp >= getXpThreshold(newLvl)) {
                        newXp -= getXpThreshold(newLvl);
                        newLvl++;
                    }
                    return { ...m, xp: newXp, level: newLvl };
                }));
                addLog(`🍱 Leftovers: Colony gorged on debris! All gained +${leftoverXP} XP.`);

                setBattlesSinceRest(prev => prev + 1);
                setView('REWARD');
            };

            const finishReward = (choice) => {
                if (choice === 'rest') {
                    setPlayerHP(prev => Math.min(maxHP, prev + 20));
                    addLog("Metabolized debris. HP Recovered.");
                } else if (choice === 'loot') {
                    const r = Math.random();
                    if (r < 0.4) {
                        addLog("Scavenged debris... found nothing useful.");
                    } else if (r < 0.8) {
                        setInventory(prev => ({...prev, abx: prev.abx + 1}));
                        addLog("Scavenged 1 ABX!");
                    } else {
                        setInventory(prev => ({...prev, fmt: prev.fmt + 1}));
                        addLog("Scavenged 1 FMT Kit! Rare find.");
                    }
                }
                startShedding();
            };

            const startShedding = () => {
                setMicrobes(prev => prev.map(m => ({ ...m, abundance: m.abundance * 0.85 })));
                generateSheddingMixes();
                setView('SHEDDING');
            };

            const selectProbioticMix = (mix) => {
                setMicrobes(prev => {
                    let currentMicrobes = [...prev];
                    mix.bugs.forEach(newBug => {
                        const existingIndex = currentMicrobes.findIndex(m => m.name === newBug.name && m.type === 'commensal');
                        if (existingIndex >= 0) {
                            currentMicrobes[existingIndex] = { ...currentMicrobes[existingIndex], abundance: currentMicrobes[existingIndex].abundance + 5 };
                        } else {
                            const bugToAdd = createMicrobe({ ...SPECIES_DB[newBug.key], key: newBug.key }, `bug_${Date.now()}_${Math.random()}`, 5);
                            bugToAdd.level = level;
                            currentMicrobes.push(bugToAdd);
                        }
                    });
                    addLog(`Colonized with ${mix.name}.`);
                    return normalizeAbundance(currentMicrobes);
                });
                setLevel(prev => prev + 1);
                setView('MAP');
            };

            // --- Header Component ---
            const Header = () => (
                <header className="p-4 bg-gray-800 border-b border-gray-700 flex flex-col md:flex-row justify-between items-center gap-4 shadow-md shrink-0 relative z-30">
                    <div className="flex flex-col w-full md:w-auto gap-2">
                        <div className="flex items-center gap-4 flex-wrap">
                            <div className="bg-gray-900 p-2 rounded-lg border border-gray-600 flex items-center gap-3 text-sm md:text-base">
                                <div className="text-red-400 font-bold whitespace-nowrap"><i className="fa-solid fa-heart"></i> {playerHP}/{maxHP}</div>
                                <div className="h-4 w-px bg-gray-600"></div>
                                <div className="text-blue-400 whitespace-nowrap"><i className="fa-solid fa-layer-group"></i> Lv {level}</div>
                                <div className="h-4 w-px bg-gray-600"></div>
                                <div className="text-teal-400 font-bold font-mono whitespace-nowrap" title="Shannon Entropy (Diversity Score)">
                                    <i className="fa-solid fa-chart-network mr-1"></i> H: {currentEntropy.toFixed(2)}
                                </div>
                                <div className="h-4 w-px bg-gray-600"></div>
                                <div className="text-yellow-400 font-bold font-mono whitespace-nowrap" title="Score">
                                    <i className="fa-solid fa-star mr-1"></i>{score.toLocaleString()}
                                </div>
                                {comboCount > 0 && (
                                    <div className={`px-2 py-0.5 rounded text-xs font-bold animate-pulse ${comboMultiplier >= 3 ? 'bg-red-500/30 text-red-300 border border-red-500' : comboMultiplier >= 2 ? 'bg-orange-500/30 text-orange-300 border border-orange-500' : 'bg-yellow-500/30 text-yellow-300 border border-yellow-500'}`}>
                                        ⚡ {comboCount} COMBO {comboMultiplier > 1 ? `×${comboMultiplier}` : ''}
                                    </div>
                                )}
                            </div>

                            {/* Inventory / Actions */}
                            <div className="flex gap-2 flex-wrap">
                                <button
                                    onClick={useABX}
                                    disabled={inventory.abx === 0 || (view !== 'BATTLE' && view !== 'MAP') || view === 'SHEDDING'}
                                    className={`px-3 py-1 rounded border text-xs flex items-center gap-1 ${
                                        inventory.abx > 0 && (view === 'BATTLE' || view === 'MAP') && view !== 'SHEDDING'
                                        ? 'bg-yellow-600/20 border-yellow-500 text-yellow-200 hover:bg-yellow-600/40 cursor-pointer'
                                        : 'bg-gray-700 border-gray-600 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    <i className="fa-solid fa-pills"></i> ABX ({inventory.abx})
                                </button>

                                <button
                                    onClick={() => toggleTargeting('food')}
                                    disabled={inventory.food === 0 || view === 'SHEDDING' || targetingMode === 'phage'}
                                    className={`px-3 py-1 rounded border text-xs flex items-center gap-1 transition-all ${
                                        targetingMode === 'food' ? 'bg-green-500 text-white shadow-[0_0_10px_rgba(34,197,94,0.5)] border-green-300 scale-105' :
                                        inventory.food > 0 && view !== 'SHEDDING'
                                        ? 'bg-green-600/20 border-green-500 text-green-200 hover:bg-green-600/40 cursor-pointer'
                                        : 'bg-gray-700 border-gray-600 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    {targetingMode === 'food' && <i className="fa-solid fa-crosshairs animate-spin-slow"></i>}
                                    {!targetingMode && <i className="fa-solid fa-apple-whole"></i>}
                                    Food ({inventory.food})
                                </button>

                                <button
                                    onClick={() => toggleTargeting('phage')}
                                    disabled={inventory.phage === 0 || view === 'SHEDDING' || targetingMode === 'food'}
                                    className={`px-3 py-1 rounded border text-xs flex items-center gap-1 transition-all ${
                                        targetingMode === 'phage' ? 'bg-purple-500 text-white shadow-[0_0_10px_rgba(168,85,247,0.5)] border-purple-300 scale-105' :
                                        inventory.phage > 0 && view !== 'SHEDDING'
                                        ? 'bg-purple-600/20 border-purple-500 text-purple-200 hover:bg-purple-600/40 cursor-pointer'
                                        : 'bg-gray-700 border-gray-600 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    {targetingMode === 'phage' && <i className="fa-solid fa-crosshairs animate-spin-slow"></i>}
                                    {!targetingMode && <i className="fa-solid fa-vial"></i>}
                                    Phage ({inventory.phage})
                                </button>

                                <button
                                    onClick={usePrebiotic}
                                    disabled={inventory.prebiotic === 0 || view === 'SHEDDING'}
                                    className={`px-3 py-1 rounded border text-xs flex items-center gap-1 ${
                                        inventory.prebiotic > 0 && view !== 'SHEDDING'
                                        ? 'bg-emerald-600/20 border-emerald-500 text-emerald-200 hover:bg-emerald-600/40 cursor-pointer'
                                        : 'bg-gray-700 border-gray-600 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    <i className="fa-solid fa-seedling"></i> Fiber ({inventory.prebiotic})
                                </button>

                                <button
                                    onClick={useProbioticCapsule}
                                    disabled={inventory.capsule === 0 || view === 'SHEDDING'}
                                    className={`px-3 py-1 rounded border text-xs flex items-center gap-1 ${
                                        inventory.capsule > 0 && view !== 'SHEDDING'
                                        ? 'bg-pink-600/20 border-pink-500 text-pink-200 hover:bg-pink-600/40 cursor-pointer'
                                        : 'bg-gray-700 border-gray-600 text-gray-500 cursor-not-allowed'
                                    }`}
                                >
                                    <i className="fa-solid fa-capsules"></i> Capsule ({inventory.capsule})
                                </button>

                                <div className={`px-3 py-1 rounded border text-xs flex items-center gap-1 ${inventory.fmt > 0 ? 'bg-blue-600/20 border-blue-500 text-blue-200' : 'bg-gray-700 border-gray-600 text-gray-500'}`}>
                                    <i className="fa-solid fa-poop"></i> FMT ({inventory.fmt})
                                </div>
                            </div>

                            <button
                                onClick={() => setIsLogOpen(!isLogOpen)}
                                className="md:hidden w-8 h-8 rounded-full bg-gray-700 border border-gray-600 flex items-center justify-center relative"
                            >
                                <i className="fa-solid fa-terminal text-gray-400"></i>
                                {!isLogOpen && unreadLogs > 0 && (
                                    <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border border-gray-900 animate-pulse"></span>
                                )}
                            </button>

                                                className={`cursor-pointer p-6 rounded-xl border transition-all text-center relative overflow-hidden ${
                                                    battlesSinceRest >= BATTLES_FOR_REST && level % 5 !== 0
                                                    ? 'bg-gray-800 border-gray-700 hover:border-green-500 hover:bg-gray-750'
                                                    : 'bg-gray-800/50 border-gray-700 opacity-50 cursor-not-allowed'
                                                }`}
                                            >
                                                <i className="fa-solid fa-bed text-4xl text-green-500 mb-4"></i>
                                                <h3 className="font-bold">Rest</h3>
                                                {level % 5 === 0 ? (
                                                    <div className="text-xs text-red-400 mt-2 font-bold uppercase">BOSS LEVEL (LOCKED)</div>
                                                ) : battlesSinceRest < BATTLES_FOR_REST ? (
                                                    <div className="w-32 h-2 bg-gray-700 rounded-full mx-auto mt-3 overflow-hidden">
                                                        <div className="bg-green-500 h-full" style={{width: `${(battlesSinceRest / BATTLES_FOR_REST) * 100}%`}}></div>
                                                    </div>
                                                ) : (
                                                    <div className="text-xs text-green-400 mt-2">Available</div>
                                                )}
                                                <div className="text-[10px] text-gray-500 mt-1">
                                                    {battlesSinceRest < BATTLES_FOR_REST ? `${battlesSinceRest}/${BATTLES_FOR_REST} Battles` : "Skip Battle (replenish HP)"}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'REWARD' && (
                            <div className="flex-1 flex flex-col items-center justify-center p-8">
                                <h2 className="text-3xl font-bold text-yellow-400 mb-8">Encounter Cleared</h2>
                                <div className="flex gap-4">
                                    <button onClick={() => finishReward('rest')} className="px-6 py-3 bg-gray-800 border border-gray-700 rounded hover:bg-gray-700 flex flex-col items-center">
                                        <span className="font-bold">Metabolize</span>
                                        <span className="text-[10px] text-gray-400">Heal +20 HP</span>
                                    </button>
                                    <button onClick={() => finishReward('loot')} className="px-6 py-3 bg-gray-800 border border-purple-500/50 rounded hover:bg-gray-700 flex flex-col items-center">
                                        <span className="font-bold text-purple-300">Scavenge</span>
                                        <span className="text-[10px] text-gray-400">Chance for ABX/FMT</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'BATTLE' && (
                            <div className="flex-1 flex flex-col gap-6 pt-4">
                                <div className="flex flex-row justify-between items-center py-8 px-4 md:px-12 bg-gradient-to-b from-gray-800/50 to-transparent rounded-xl border border-gray-800/50 relative overflow-hidden shrink-0">
                                    <div className="flex flex-col items-center z-10 w-1/3">
                                        <div className="w-24 h-24 bg-blue-900/50 rounded-full flex items-center justify-center border-4 border-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.3)] mb-4">
                                            <i className="fa-solid fa-user-shield text-4xl text-blue-200"></i>
                                        </div>
                                        <h3 className="font-bold text-blue-200 mb-2">THE HOST</h3>
                                        <div className="w-full max-w-[150px]">
                                            <ProgressBar value={playerHP} max={maxHP} shield={shield} color="bg-blue-500" label="Integrity" />
                                        </div>
                                    </div>
                                    <div className="text-2xl font-bold text-gray-600 italic z-0 opacity-50">VS</div>
                                    <div className="flex flex-col items-center z-10 w-1/3">
                                        <div className={`w-24 h-24 bg-red-900/50 rounded-full flex items-center justify-center border-4 ${isFinalBossActive ? 'border-yellow-500 shadow-[0_0_30px_rgba(234,179,8,0.5)]' : 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.3)]'} mb-4`}>
                                            <i className={`fa-solid ${isFinalBossActive ? 'fa-skull-crossbones' : 'fa-virus'} text-4xl ${isFinalBossActive ? 'text-yellow-200' : 'text-red-200'}`}></i>
                                        </div>
                                        <div className="flex flex-col items-center">
                                            <h3 className={`font-bold mb-2 text-center ${isFinalBossActive ? 'text-yellow-200' : 'text-red-200'}`}>
                                                {enemy?.modifier && MODIFIERS.enemy[enemy.modifier] && <span className={`text-[10px] block ${MODIFIERS.enemy[enemy.modifier].color}`}>{MODIFIERS.enemy[enemy.modifier].name}</span>}
                                                {enemy?.name}
                                                {isFinalBossActive && <span className="block text-[10px] text-yellow-400 mt-1">Phase {finalBossPhase}/3</span>}
                                            </h3>
                                            <span className={`text-[10px] px-2 py-0.5 rounded border mb-2 uppercase tracking-widest font-bold ${enemy?.rps === 'red' ? 'bg-red-900/50 border-red-500 text-red-400' : enemy?.rps === 'green' ? 'bg-green-900/50 border-green-500 text-green-400' : 'bg-blue-900/50 border-blue-500 text-blue-400'}`}>
                                                {enemy?.rps === 'red' ? 'Inflammatory' : enemy?.rps === 'green' ? 'Metabolic' : 'Chemical'}
                                            </span>
                                            {enemy?.mechanic && (
                                                <span className="text-[10px] text-red-300 bg-red-900/30 px-2 py-0.5 rounded border border-red-700 mb-2 text-center">{enemy.mechanicDesc}</span>
                                            )}
                                        </div>
                                        <div className="w-full max-w-[150px]">
                                            <ProgressBar value={enemy?.currentHp || 0} max={enemy?.maxHp || 1} color={isFinalBossActive ? 'bg-yellow-500' : 'bg-red-500'} label="Infection" shield={enemyShield} />
                                        </div>
                                        <div className="mt-2 text-xs text-gray-400 bg-black/40 px-2 py-1 rounded">
                                            <i className="fa-solid fa-crosshairs mr-1"></i> {enemy?.dmg} DMG
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-center shrink-0">
                                    <div className={`px-8 py-2 rounded-full text-sm font-bold tracking-widest border ${turn === 0 ? 'bg-green-900/30 border-green-500 text-green-400' : 'bg-red-900/30 border-red-500 text-red-400'}`}>
                                        {turn === 0 ? "YOUR TURN" : "ENEMY TURN"}
                                    </div>
                                </div>

                                <div className="flex-1 bg-gray-800/50 rounded-xl p-6 border border-gray-700 backdrop-blur-sm overflow-y-auto">
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 pb-4">
                                        {microbes.map(m => (
                                            <MicrobeCard
                                                key={m.id}
                                                microbe={m}
                                                threshold={dynamicThreshold}
                                                isTurn={turn === 0}
                                                enemyType={enemy?.rps}
                                                onAction={handlePlayerAction}
                                                targetingMode={targetingMode}
                                                onTargetSelect={handleTargetSelect}
                                                activeSynergies={activeSynergies}
                                                silencedMicrobes={silencedMicrobes}
                                                skippedMicrobes={skippedMicrobes}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </GameLayout>

                    {showHelp && <InstructionsModal onClose={() => setShowHelp(false)} />}
                    {showFMTPreview && frozenSample && <FMTPreviewModal sample={frozenSample} onClose={() => setShowFMTPreview(false)} />}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
