<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mbiota</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d0d0d'/><rect x='5' y='11' width='22' height='10' rx='5' fill='%23f2ebdc'/><rect x='5' y='11' width='11' height='10' rx='5' fill='%23d0392a'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <a class="brand" href="../mbiota.html" title="Back to the Mbiota page"><i class="mark"><b></b><b></b></i>MBIOTA</a>
        <div class="turn"><b id="turn">Month 1 of 6</b><span id="phase"></span><div class="bar timer" id="timer"><i id="b-timer"></i></div></div>
        <div class="bars">
          <label>Inflammation<div class="bar infl"><i id="b-infl"></i><u id="m-over"></u></div></label>
          <label><span id="pop-label">Colony</span><div class="bar pop"><i id="b-pop"></i></div></label>
          <div class="score"><span>Remission score</span><b id="score">0</b><em id="streak"></em></div>
        </div>
      </div>
      <div id="banner"></div>
      <div class="patches" id="patches"></div>
    </div>
    <div id="hand"></div>
    <div id="summary"></div>
    <div id="screen"></div>
    <div id="tip"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
